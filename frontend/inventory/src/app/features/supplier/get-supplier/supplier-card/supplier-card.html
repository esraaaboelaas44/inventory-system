<div class="card supplier-card active" data-status="active">
  <div class="flex items-start justify-between mb-3">
    <div>
      <h3 class="text-lg font-semibold text-slate-900">{{ supplier.name }}</h3>
      <p class="text-sm text-slate-500">{{ supplier.industry }}</p>
    </div>
    <span class="status-badge active">
      <span class="dot"></span>
    </span>
  </div>

  <div class="space-y-3">
    <div>
      <div class="info-label">Contact Person</div>
      <div class="info-value">{{ supplier.contactPerson.name }}</div>
      <div class="text-sm text-slate-500">{{ supplier.contactPerson.email }}</div>
      <div class="text-sm text-slate-500">{{ supplier.contactPerson.phone }}</div>
    </div>

    <div>
      <div class="info-label">Company Contact</div>
      <div class="info-value">{{ supplier.email }}</div>
      <div class="text-sm text-slate-500">{{ supplier.phone }}</div>
    </div>

    <div>
      <div class="info-label">Address</div>
      <div class="text-sm text-slate-700">
        {{ supplier.address }}
      </div>
    </div>
  </div>

  <div class="mt-4 pt-4 border-t border-slate-100 flex gap-2 justify-end">
    <button
      class="text-sm text-slate-600 hover:text-slate-900 font-medium px-3 py-1 rounded hover:bg-slate-100 transition"
    >
      Edit
    </button>
    <button
      class="deleteBtn"
      class="text-sm text-rose-600 hover:text-rose-700 font-medium px-3 py-1 rounded hover:bg-rose-50 transition"
      (click)="onDelete($event)"
    >
      Delete
    </button>
  </div>
</div>
