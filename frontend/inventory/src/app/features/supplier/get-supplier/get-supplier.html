<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventra — Suppliers</title>
    <!-- Tailwind via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.4.3/tailwind.min.js"></script>
    <style>
      body {
        font-family: 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
        background-color: #f1f5f9;
      }
      ::selection {
        background-color: #1e293b;
        color: white;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      .card {
        background-color: white;
        border-radius: 0.75rem;
        border: 1px solid #e2e8f0;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        padding: 1.5rem;
        transition: all 0.2s ease;
      }

      .card:hover {
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      .page-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 0.5rem;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.025em;
        gap: 0.375rem;
      }

      .status-badge.active {
        background-color: #dcfce7;
        color: #166534;
      }

      .status-badge.inactive {
        background-color: #fee2e2;
        color: #991b1b;
      }

      .status-badge .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        display: inline-block;
      }

      .status-badge.active .dot {
        background-color: #22c55e;
      }

      .status-badge.inactive .dot {
        background-color: #ef4444;
      }

      .supplier-card {
        transition: all 0.2s ease;
        border-left: 4px solid transparent;
      }

      .supplier-card.active {
        border-left-color: #22c55e;
      }

      .supplier-card.inactive {
        border-left-color: #ef4444;
        opacity: 0.75;
      }

      .supplier-card:hover {
        transform: translateY(-2px);
      }

      .info-label {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #94a3b8;
      }

      .info-value {
        font-size: 0.875rem;
        color: #0f172a;
        font-weight: 500;
      }

      .grid-suppliers {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      @media (min-width: 640px) {
        .grid-suppliers {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (min-width: 1024px) {
        .grid-suppliers {
          grid-template-columns: 1fr 1fr 1fr;
        }
      }

      .filter-btn {
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.15s ease;
        border: 1px solid #e2e8f0;
        background-color: white;
        color: #475569;
        cursor: pointer;
      }

      .filter-btn:hover {
        background-color: #f8fafc;
        border-color: #cbd5e1;
      }

      .filter-btn.active {
        background-color: #0f172a;
        color: white;
        border-color: #0f172a;
      }

      .filter-btn.active:hover {
        background-color: #1e293b;
      }

      .search-input {
        width: 100%;
        border-radius: 0.5rem;
        border: 1px solid #cbd5e1;
        padding: 0.5rem 0.75rem 0.5rem 2.5rem;
        font-size: 0.875rem;
        background-color: white;
        color: #0f172a;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      .search-input:focus {
        outline: none;
        border-color: #0f172a;
        box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.2);
      }

      .search-wrapper {
        position: relative;
      }

      .search-icon {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        pointer-events: none;
      }

      .empty-state {
        text-align: center;
        padding: 3rem 1.5rem;
        color: #94a3b8;
      }

      .empty-state svg {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1rem;
        color: #cbd5e1;
      }

      app-sidebar {
        display: block;
        width: 4rem;
        flex-shrink: 0;
      }

      @media (min-width: 640px) {
        app-sidebar {
          width: 16rem;
        }
      }

      .app {
        display: flex;
        min-height: 100vh;
      }

      .content {
        flex: 1;
        padding: 2rem 1.5rem;
        max-width: 80rem;
        margin: 0 auto;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <app-sidebar></app-sidebar>

      <main class="content">
        <!-- Breadcrumb -->
        <p class="text-xs font-semibold tracking-widest text-slate-400 uppercase mb-1">
          Suppliers / List
        </p>
        <div class="flex items-center justify-between flex-wrap gap-4 mb-6">
          <h1 class="page-title">All Suppliers</h1>
          <button
            class="inline-flex items-center gap-2 px-4 py-2 bg-slate-900 text-white rounded-lg hover:bg-slate-800 transition text-sm font-semibold"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4v16m8-8H4"
              ></path>
            </svg>
            Add Supplier
          </button>
        </div>

        <!-- Filters and Search -->
        <div class="card mb-6">
          <div class="flex flex-col sm:flex-row gap-4">
            <div class="flex-1 search-wrapper">
              <svg
                class="search-icon w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                ></path>
              </svg>
              <input
                type="text"
                class="search-input"
                placeholder="Search suppliers by name, email, or industry..."
                id="searchInput"
              />
            </div>
            <div class="flex gap-2 flex-wrap">
              <button class="filter-btn active" data-filter="all">All</button>
              <button class="filter-btn" data-filter="active">Active</button>
              <button class="filter-btn" data-filter="inactive">Inactive</button>
            </div>
          </div>
        </div>

        <!-- Supplier Grid -->
        <div class="grid-suppliers" id="supplierGrid">
          @for (supplier1 of SUPPLIERS; track supplier1.name) {
            <app-supplier-card [supplier]="supplier1" />
          }
        </div>
        <!-- Empty State (hidden by default) -->
        <div class="card empty-state hidden" id="emptyState">
          <svg class="mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
            ></path>
          </svg>
          <p class="text-lg font-medium text-slate-700 mb-1">No suppliers found</p>
          <p class="text-sm text-slate-500">Try adjusting your search or filter criteria</p>
        </div>
      </main>
    </div>

    <script>
      // Filter functionality
      const filterButtons = document.querySelectorAll('.filter-btn');
      const supplierCards = document.querySelectorAll('.supplier-card');
      const searchInput = document.getElementById('searchInput');
      const emptyState = document.getElementById('emptyState');
      const supplierGrid = document.getElementById('supplierGrid');

      // Filter suppliers
      function filterSuppliers() {
        const searchTerm = searchInput.value.toLowerCase().trim();
        const activeFilter = document.querySelector('.filter-btn.active')?.dataset.filter || 'all';

        let visibleCount = 0;

        supplierCards.forEach((card) => {
          const status = card.dataset.status;
          const name = card.querySelector('h3')?.textContent?.toLowerCase() || '';
          const email = card.querySelector('.info-value')?.textContent?.toLowerCase() || '';
          const industry =
            card.querySelector('.text-sm.text-slate-500')?.textContent?.toLowerCase() || '';

          const matchesFilter = activeFilter === 'all' || status === activeFilter;
          const matchesSearch =
            name.includes(searchTerm) ||
            email.includes(searchTerm) ||
            industry.includes(searchTerm);

          if (matchesFilter && matchesSearch) {
            card.style.display = '';
            visibleCount++;
          } else {
            card.style.display = 'none';
          }
        });

        // Show/hide empty state
        if (visibleCount === 0) {
          emptyState.classList.remove('hidden');
          supplierGrid.classList.add('hidden');
        } else {
          emptyState.classList.add('hidden');
          supplierGrid.classList.remove('hidden');
        }
      }

      // Filter button clicks
      filterButtons.forEach((btn) => {
        btn.addEventListener('click', function () {
          filterButtons.forEach((b) => b.classList.remove('active'));
          this.classList.add('active');
          filterSuppliers();
        });
      });

      // Search input
      searchInput.addEventListener('input', filterSuppliers);

      // Initialize
      filterSuppliers();

      // Add Supplier button click handler
      document
        .querySelector('.inline-flex.items-center.gap-2.px-4.py-2.bg-slate-900')
        ?.addEventListener('click', function () {
          alert('Navigate to Add Supplier page');
          // In a real app: router.navigate(['/suppliers/add'])
        });

      // Edit button handlers
      document.querySelectorAll('.supplier-card .text-slate-600').forEach((btn) => {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const supplierName = this.closest('.supplier-card').querySelector('h3')?.textContent;
          alert(`Edit supplier: ${supplierName}`);
        });
      });

      // Delete button handlers
      document.querySelectorAll('.supplier-card .text-rose-600').forEach((btn) => {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const supplierName = this.closest('.supplier-card').querySelector('h3')?.textContent;
          if (confirm(`Are you sure you want to delete supplier: ${supplierName}?`)) {
            alert(`Supplier "${supplierName}" deleted`);
            this.closest('.supplier-card').remove();
            filterSuppliers();
          }
        });
      });
    </script>
  </body>
</html>
