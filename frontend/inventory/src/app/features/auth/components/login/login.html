<!DOCTYPE html>
<div class="min-h-screen flex">

  <!-- Left -->
  <div class="w-full lg:w-1/2 flex items-center justify-center bg-white">

    <div class="w-105">

      <h1 class="text-5xl font-bold text-[#11194d] mb-6">
        Inventra
      </h1>

      <p class="text-gray-600 text-lg mb-12">
        See your growth and get support!
      </p>


      <form>

        <div class="mb-6">

          <label class="block font-semibold mb-2">
            Username
          </label>

          <input
          type="text"
          placeholder="Enter your username"
          class="w-full bg-gray-100 border border-gray-300 rounded-lg p-4 outline-none focus:ring-2 focus:ring-indigo-700"
          >

        </div>


        <div class="mb-6">

          <label class="block font-semibold mb-2">
            Password
          </label>

          <input
          type="password"
          placeholder="Enter your password"
          class="w-full bg-gray-100 border border-gray-300 rounded-lg p-4 outline-none focus:ring-2 focus:ring-indigo-700"
          >

        </div>

        <div class="flex justify-between mb-8">

          <label class="flex items-center gap-2">
            <input type="checkbox">
            Remember me
          </label>

          <a class="text-[#11194d] font-semibold">
            Forgot password ?
          </a>

        </div>



        <button
        class="w-full bg-[#103645] text-white py-4 rounded-full text-lg font-semibold">
          Login
        </button>


      </form>


    </div>

  </div>




  <!-- Right -->

  <div class="hidden lg:flex w-1/2 bg-[#103746] items-center justify-center">

    <div class="bg-white rounded-3xl w-105 h-75 flex items-center justify-center">

      <h2 class="text-4xl font-bold text-[#11194d]">
        Inventra
      </h2>

    </div>

  </div>


</div>
