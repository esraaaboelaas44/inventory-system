<div class="page">
  <section class="card">

    <!-- LEFT SIDE -->

    <div class="left-panel">

      <div class="left-inner">

        <img
          src="logo.png"
          alt="Inventra"
          class="logo"
        />

        <p class="subtitle" style="font-size: 16px; font-weight:600;;">
          See your growth and get support!
        </p>

        <form
  class="login-form"
  #loginForm="ngForm"
  (ngSubmit)="login()"
  novalidate
>

  <!-- Email -->
  <div class="form-group">

    <label for="email">Email</label>

    <input
      id="email"
      name="email"
      type="email"
      placeholder="Enter your Email"
      required
      email
      maxlength="100"
      [(ngModel)]="loginData.email"
      #email="ngModel"
    />

    <small
      style="color:red"
      *ngIf="email.invalid && (email.touched || loginForm.submitted)">

      <span *ngIf="email.errors?.['required']">
        Email is required.
      </span>

      <span *ngIf="email.errors?.['email']">
        Please enter a valid email.
      </span>

    </small>

  </div>

  <!-- Password -->
  <div class="form-group">

    <label for="password">Password</label>

    <input
      id="password"
      name="password"
      type="password"
      placeholder="Enter your password"
      required
      minlength="3"
      maxlength="30"
      [(ngModel)]="loginData.password"
      #password="ngModel"
    />

    <small
      style="color:red"
      *ngIf="password.invalid && (password.touched || loginForm.submitted)">

      <span *ngIf="password.errors?.['required']">
        Password is required.
      </span>

      <span *ngIf="password.errors?.['minlength']">
        Password must be at least 3 characters.
      </span>

    </small>

  </div>

  <div class="options">

    <label class="remember">

      <input
        type="checkbox"
        name="remember"
        [(ngModel)]="rememberMe"
      />

      <span>Remember me</span>

    </label>

    <a
      href="#"
      class="forget"
      (click)="$event.preventDefault()">

      Forget password ?

    </a>

  </div>

  <button
    class="login-button"
    type="submit"
    [disabled]="isLoading">

    {{ isLoading ? 'Logging in...' : 'Login' }}

  </button>

  <div
    *ngIf="errorMessage"
    style="margin-top:15px;color:#dc3545;font-weight:600;text-align:center">

    {{ errorMessage }}

  </div>

</form>

      </div>

    </div>

    <!-- RIGHT SIDE -->

    <div class="right-panel">

      <!-- Decorative Squares -->

      <span class="square s1"></span>
      <span class="square s2"></span>
      <span class="square s3"></span>
      <span class="square s4"></span>
      <span class="square s5"></span>
      <span class="square s6"></span>
      <span class="square s7"></span>
      <span class="square s8"></span>
      <span class="square s9"></span>
      <span class="square s10"></span>

      <!-- Chart -->

      <div class="chart-card">

        <svg
          class="chart-svg"
          viewBox="0 0 620 330"
        >

          <rect
            x="0"
            y="0"
            width="620"
            height="330"
            rx="20"
            fill="white"
          />

          <g stroke="#ECECEC">

            <line x1="40" y1="50" x2="580" y2="50"/>

            <line x1="40" y1="95" x2="580" y2="95"/>

            <line x1="40" y1="140" x2="580" y2="140"/>

            <line x1="40" y1="185" x2="580" y2="185"/>

            <line x1="40" y1="230" x2="580" y2="230"/>

            <line x1="40" y1="275" x2="580" y2="275"/>

          </g>

          <path
            d="M55 250
            C90 190 120 205 145 170
            S195 195 215 150
            S260 180 285 125
            S330 160 360 105
            S405 130 440 75
            S500 90 565 30"
            fill="none"
            stroke="#BFCB5B"
            stroke-width="4"
            stroke-linecap="round"
          />

          <path
            d="M55 175
            C160 140 250 110 565 45"
            fill="none"
            stroke="#EF833C"
            stroke-width="3"
            stroke-dasharray="7 7"
          />

          <path
            d="M55 225
            C180 180 300 150 565 95"
            fill="none"
            stroke="#8B9873"
            stroke-width="3"
            stroke-dasharray="7 7"
          >

          </path>

        </svg>

      </div>

      <!-- DONUT -->

      <div class="donut-card">

        <svg
          class="donut-svg"
          viewBox="0 0 220 220"
        >

          <circle
            cx="110"
            cy="110"
            r="88"
            fill="none"
            stroke="#DCE5E7"
            stroke-width="28"
          />

          <circle
          cx="110"
          cy="110"
          r="88"
          fill="none"
          stroke="#080E47"
          stroke-width="28"
          stroke-linecap="round"
          stroke-dasharray="258 182"
          transform="rotate(-90 110 110)"
          />


          <text
            x="116"
            y="123"
            text-anchor="middle"
            font-size="38"
            font-weight="700"
          >
            68%
          </text>

        </svg>

      </div>

    </div>

  </section>

</div>
