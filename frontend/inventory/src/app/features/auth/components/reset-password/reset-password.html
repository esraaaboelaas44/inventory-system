<div class="page">

  <section class="card">

    <div class="left-panel">

      <div class="left-inner">

        <img
          src="logo.png"
          alt="Inventra"
          class="logo"
        >

        <h2 class="title">
          Reset Password
        </h2>

        <p class="subtitle">
          Enter your new password below.
        </p>

        <form
          #resetForm="ngForm"
          (ngSubmit)="submit(resetForm)"
          novalidate
        >

          <div class="form-group">

            <label for="password">
              New Password
            </label>

            <input
              id="password"
              name="password"
              type="password"
              required
              minlength="6"
              maxlength="30"
              [(ngModel)]="password"
              #passwordModel="ngModel"
              placeholder="Enter new password"
            >

            <small
              class="field-error"
              *ngIf="
                passwordModel.invalid &&
                (passwordModel.touched || resetForm.submitted)
              "
            >

              <span *ngIf="passwordModel.errors?.['required']">
                Password is required.
              </span>

              <span *ngIf="passwordModel.errors?.['minlength']">
                Password must be at least 6 characters.
              </span>

            </small>

          </div>

          <div class="form-group">

            <label for="confirmPassword">
              Confirm Password
            </label>

            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              required
              minlength="6"
              maxlength="30"
              [(ngModel)]="confirmPassword"
              #confirmPasswordModel="ngModel"
              placeholder="Confirm password"
            >

            <small
              class="field-error"
              *ngIf="
                confirmPasswordModel.invalid &&
                (confirmPasswordModel.touched || resetForm.submitted)
              "
            >

              <span *ngIf="confirmPasswordModel.errors?.['required']">
                Confirm password is required.
              </span>

              <span *ngIf="confirmPasswordModel.errors?.['minlength']">
                Password must be at least 6 characters.
              </span>

            </small>

          </div>

          <p
            class="success-message"
            *ngIf="successMessage"
          >
            {{ successMessage }}
          </p>

          <p
            class="error-message"
            *ngIf="errorMessage"
          >
            {{ errorMessage }}
          </p>

          <button
            type="submit"
            class="submit-btn"
            [disabled]="loading"
          >

            {{
              loading
                ? 'Saving...'
                : 'Reset Password'
            }}

          </button>

        </form>

      </div>

    </div>

  </section>

</div>
