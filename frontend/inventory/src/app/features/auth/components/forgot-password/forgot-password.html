<div class="page">

  <section class="card">

    <div class="left-panel">

      <div class="left-inner">

        <img
          src="logo.png"
          alt="Inventra"
          class="logo"
        >

        <h2 class="title">
          Forgot Password
        </h2>

        <p class="subtitle">
          Enter your email address and we'll send you a password reset link.
        </p>

        <form
          #forgotForm="ngForm"
          (ngSubmit)="submit(forgotForm)"
          novalidate
        >

          <div class="form-group">

            <label for="email">
              Email
            </label>

            <input
              id="email"
              name="email"
              type="email"
              required
              email
              maxlength="100"
              [(ngModel)]="email"
              #emailModel="ngModel"
              placeholder="Enter your email"
            >

            <small
              class="field-error"
              *ngIf="
                emailModel.invalid &&
                (emailModel.touched || forgotForm.submitted)
              "
            >

              <span *ngIf="emailModel.errors?.['required']">
                Email is required.
              </span>

              <span *ngIf="emailModel.errors?.['email']">
                Please enter a valid email.
              </span>

            </small>

          </div>

          <p
            class="success-message"
            *ngIf="successMessage"
          >
            {{ successMessage }}
          </p>

          <p
            class="error-message"
            *ngIf="errorMessage"
          >
            {{ errorMessage }}
          </p>

          <button
            type="submit"
            class="submit-btn"
            [disabled]="loading"
          >

            {{
              loading
                ? 'Sending...'
                : 'Send Reset Link'
            }}

          </button>

          <button
            type="button"
            class="back-btn"
            (click)="back()"
          >
            Back to Login
          </button>

        </form>

      </div>

    </div>

  </section>

</div>
